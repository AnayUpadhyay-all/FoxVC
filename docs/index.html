<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FoxVC Playground — Zero-Dependency Native Scripting Engine</title>
    <meta name="description" content="Official in-browser WebAssembly playground for FoxVC: an ultra-compact, 25-keyword native programming language.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
    
    <!-- CodeMirror Editor CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/nord.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation & Action Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="https://github.com/AnayUpadhyay-all/FoxVC" class="brand" target="_blank" rel="noopener">
                <span class="brand-icon">🦊</span>
                <span class="brand-name">FoxVC</span>
                <span class="badge">Playground</span>
            </a>

            <div class="control-group">
                <label for="exampleSelect" class="sr-only">Examples</label>
                <select id="exampleSelect" class="select-dropdown" aria-label="Load Example Code">
                    <option value="hello">Example: Hello World</option>
                    <option value="fibonacci">Benchmark: Fibonacci (100k)</option>
                    <option value="tour">Tour: 25-Keyword Syntax</option>
                    <option value="game">Routine: Tic-Tac-Toe Arena</option>
                </select>
            </div>
        </div>

        <div class="topbar-center">
            <button id="runBtn" class="btn btn-primary" title="Execute Code (Ctrl + Enter)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <span>Run</span>
                <kbd class="shortcut-tag">Ctrl+↵</kbd>
            </button>
        </div>

        <div class="topbar-right">
            <button id="copyBtn" class="btn btn-secondary" title="Copy code to clipboard">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span>Copy</span>
            </button>
            <button id="shareBtn" class="btn btn-secondary" title="Create shareable URL">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                <span>Share</span>
            </button>
            <button id="clearBtn" class="btn btn-secondary" title="Clear terminal output">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>Clear</span>
            </button>
            <a href="https://github.com/AnayUpadhyay-all/FoxVC" target="_blank" rel="noopener" class="btn btn-icon" title="View Source on GitHub">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
            </a>
        </div>
    </header>

    <!-- Main Split Workspace -->
    <main class="workspace">
        <!-- Editor Panel -->
        <section class="panel editor-panel">
            <div class="panel-header">
                <span class="panel-title">
                    <span class="dot active"></span>
                    <span>main.fox</span>
                </span>
                <span class="engine-badge">FoxVC v1.0 (WASM)</span>
            </div>
            <div class="editor-container">
                <textarea id="codeEditor"></textarea>
            </div>
        </section>

        <!-- Divider Bar -->
        <div class="resizer" id="dragResizer"></div>

        <!-- Terminal Output Panel -->
        <section class="panel terminal-panel">
            <div class="panel-header">
                <div class="terminal-dots">
                    <span class="t-dot red"></span>
                    <span class="t-dot yellow"></span>
                    <span class="t-dot green"></span>
                    <span class="terminal-label">FoxVM Console</span>
                </div>
                <div class="terminal-meta">
                    <span id="execTimer" class="exec-timer">Ready</span>
                    <span id="engineStatus" class="engine-status ready">Engine Ready</span>
                </div>
            </div>
            <div class="terminal-body" id="terminalOutput">
                <div class="term-line prompt-line">FoxVC Bytecode Virtual Machine (WASM) initialized.</div>
                <div class="term-line dim">Press Run or hit Ctrl+Enter to execute.</div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Link copied to clipboard!</div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
