name: FoxVC CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile native C VM with strict warnings
        run: |
          gcc -Wall -Wextra -Werror -O3 -shared -fPIC \
            engine/foxvm.c -o engine/foxvm.so -lm

      - name: Run Python unit and differential tests
        run: python -m unittest discover tests

      - name: Run FoxVC source test suites
        run: python foxvc test

      - name: Lint examples
        run: python foxvc lint examples/

      - name: Run TCO and core stress fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from engine.runner import run_foxvc

          fixture = Path("tests/tco_and_core_stress.fvc")
          source = fixture.read_text(encoding="utf-8")
          marker = "# --- CORE CONTROL FLOW AND ERROR RECOVERY ---"

          if marker not in source:
              raise SystemExit(f"Missing section marker in {fixture}")

          tco_source, core_source = source.split(marker, 1)

          # The native C VM supports the TCO/control-flow subset, but not
          # SETUP_TRAP. Run the trap section separately on the interpreter.
          native = run_foxvc(
              tco_source,
              engine_mode="fast",
              as_result=True,
              filename=str(fixture),
          )
          if not native.success:
              raise SystemExit(f"Native C VM TCO run failed: {native.error}")
          if native.value != 100000:
              raise SystemExit(
                  "Native C VM assertions failed or returned an unexpected "
                  f"sentinel: {native.value!r}"
              )

          core = run_foxvc(
              marker + "\\n" + core_source,
              engine_mode="interp",
              as_result=True,
              filename=str(fixture),
          )
          if not core.success:
              raise SystemExit(f"Core control-flow/recovery run failed: {core.error}")
          if "ALL TCO AND CORE STRESS CHECKS PASSED" not in source:
              raise SystemExit("Stress fixture is missing its completion marker")
          print("TCO native VM and core interpreter checks completed.")
          PY
