name: CI Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Native C VM Engine
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            clang -O3 -shared -fPIC engine/foxvm.c -o engine/foxvm.so -lm
          else
            gcc -O3 -shared -fPIC engine/foxvm.c -o engine/foxvm.so -lm
          fi

      - name: Run Python Unit & Differential Tests
        run: |
          python -m unittest discover tests

      - name: Run FoxVC Native Test Runner
        run: |
          python foxvc test

      - name: Lint Examples
        run: |
          python foxvc lint examples/
